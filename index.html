<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8663c">
  <title>外公吃药提醒</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon.svg" alt="" class="logo">
      <div>
        <h1>外公吃药</h1>
        <div class="date" id="todayStr"></div>
      </div>
    </div>
    <span class="sync-dot" id="syncDot" data-st="off" title="未同步"></span>
  </header>

  <div id="syncBanner" class="banner" style="display:none">
    当前为本地模式：提醒功能正常，但家人之间暂不互通。配置同步服务后自动开启。
  </div>

  <main>
    <section id="notifyBox"></section>

    <div id="installBox" style="display:none">
      <button class="btn primary big" id="installBtn">安装到手机桌面</button>
    </div>

    <div class="table-wrap">
      <table id="medTable"></table>
    </div>

    <p class="hint" id="hintLine">红色 = 还没确认吃；绿色 = 已吃；灰色 = 跳过。到点后每 3 小时提醒一次，直到确认。</p>
  </main>

  <footer class="toolbar">
    <button class="chip" id="voiceChip">🔊 语音</button>
    <button class="chip" id="bigChip">🔍 大字</button>
    <button class="chip" id="settingsChip">⚙ 设置</button>
  </footer>

  <details id="settings" class="settings">
    <div class="card">
      <h2>设置</h2>
      <label class="row"><input type="checkbox" id="voiceOn"> 语音播报提醒</label>
      <label class="row"><input type="checkbox" id="bigText"> 大字模式</label>
      <label class="row">本机名称：<input type="text" id="deviceName" maxlength="8" placeholder="家人"></label>

      <div id="groupBox"></div>

      <div class="btn-row">
        <button class="btn" id="reSyncBtn">立即同步</button>
        <button class="btn danger" id="clearBtn">清除本机记录</button>
      </div>
      <p class="small" id="demoInfo"></p>
    </div>
  </details>

  <!-- 吃药确认大弹窗 -->
  <div class="overlay" id="popup">
    <div class="card popup-card">
      <h2 id="popupTitle">吃药时间</h2>
      <p class="small">每点一下按钮，就表示这种药已经吃过了：</p>
      <div id="popupMeds"></div>
      <div id="popupAllOk" class="all-ok" style="display:none">🎉 本时段全部确认！</div>
      <div class="btn-row">
        <button class="btn" id="popupSkipBtn">跳过本次</button>
        <button class="btn" id="popupCloseBtn">稍后再说</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
